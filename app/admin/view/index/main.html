{extend name='common/container'}
{block name="style"}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #696cff;
        --primary-dark: #5a5dff;
        --primary-light: #f0f0ff;
        --secondary: #8a8d93;
        --success: #71dd37;
        --info: #03c3ec;
        --warning: #ffab00;
        --danger: #ff3e1d;
        --dark: #2b2d42;
        --light: #f8f9fa;
        --border: rgba(138, 141, 147, 0.2);
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 10px;
        --space-lg: 15px;
        --space-xl: 15px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.1);
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--light);
        color: var(--dark);
        line-height: 1.5;
    }
    
    html,
    body {
        overflow: hidden;
        height: 100%;
    }
    
    .dashboard-container {
        height: 100vh;
        width: 100%;
        overflow: hidden;
        position: relative;
        padding: 0;
    }
    
    .dashboard-content {
        height: 100%;
        width: 100%;
    }
    
    .screen {
        height: 100vh;
        width: 100%;
        padding: 65px 15px 15px 15px;
        overflow-y: auto;
    }
    
    .screen::-webkit-scrollbar {
        width: 6px;
    }
    
    .screen::-webkit-scrollbar-track {
        background: rgba(138, 141, 147, 0.1);
    }
    
    .screen::-webkit-scrollbar-thumb {
        background: rgba(105, 108, 255, 0.3);
        border-radius: 3px;
    }
    
    .screen::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
    }
    
    .tutorial-link-container {
        margin: 0 0 15px 0;
    }
    
    .tutorial-link {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-lg);
        background: white;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
    }
    
    .tutorial-link:hover {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: var(--shadow-md);
        color: white;
    }
    
    .forum-shell {
        background: #fff;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
        overflow: hidden;
    }
    
    .forum-config-empty {
        min-height: calc(100vh - 130px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px 24px;
        text-align: center;
        color: var(--secondary);
        background: #fff;
    }
    
    .forum-config-icon {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 171, 0, 0.12);
        color: var(--warning);
        font-size: 24px;
    }
    
    .forum-config-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--dark);
    }
    
    .forum-config-desc {
        font-size: 14px;
        line-height: 1.8;
    }
    
    .forum-frame {
        width: 100%;
        margin: 0;
        height: calc(100vh - 130px);
        min-height: 880px;
        display: block;
        border: 0;
        background: #ffffff;
    }
    
    @media (max-width: 1024px) {
        .forum-frame {
            min-height: 760px;
        }
    }
    
    @media (max-width: 768px) {
        .screen {
            padding-top: 65px;
            padding-left: 12px;
            padding-right: 12px;
            padding-bottom: 12px;
        }
        
        .forum-frame {
            min-height: 680px;
        }
    }
</style>
{/block}

{block name="content"}
<div class="dashboard-container">
    <div class="dashboard-content">
        <div class="screen">
            <!-- 视频教程链接 -->
            <div class="tutorial-link-container">
                <a class="tutorial-link" href="https://www.bilibili.com/video/BV1SxttzjEjv" target="_blank"
                   rel="noopener noreferrer">
                    <i class="fas fa-circle-play"></i>
                    <span>tfadmin后台使用教程链接</span>
                </a>
            </div>
            {if empty($appid) || empty($secrect)}
            <div class="forum-shell">
                <div class="forum-config-empty">
                    <div class="forum-config-icon"><i class="fas fa-circle-exclamation"></i></div>
                    <div class="forum-config-title">论坛暂不可用</div>
                    <div class="forum-config-desc">请配置appid，secrect后刷新使用</div>
                </div>
            </div>
            {/if}
            {if !empty($appid) && !empty($secrect)}
            <div class="forum-shell">
                <iframe
                        id="bbsForumFrame"
                        class="forum-frame"
                        src="https://tfadmin.tiefen.net/bbsapi/bbs_index/index?appid={$appid|default=''}&secrect={$secrect|default=''}&embed=1"
                        frameborder="0"
                        scrolling="auto"
                ></iframe>
            </div>
            {/if}
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script src="__PUBLIC__/assets/js/app.js"></script>
{/block}
