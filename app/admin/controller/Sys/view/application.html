{extend name='view/common/container'}
{block name="content"}
<div style="margin:0 15px 15px 15px;">
<el-card shadow="never" style="min-height:650px;" class="table-scroll-area">
	<el-row style="margin-bottom:10px; margin-top:11px;" class="sticky-buttons">
		<el-button type="success" size="mini" icon="el-icon-plus" @click="dialog.addDialogStatus = true">新增</el-button>
		<el-button type="primary" size="mini"  icon="el-icon-edit-outline" :disabled="single" @click="editor(ids)">修改</el-button>
		<el-button type="warning" size="mini"  icon="el-icon-delete" :disabled="single" @click="buildApplication(ids,1)">生成应用</el-button>
		<el-button type="warning" size="mini"  icon="el-icon-edit-outline" :disabled="single" @click="createDocProject(ids,1)">生成apipos接口文档项目</el-button>
	</el-row>

	<el-table highlight-current-row @current-change="selection"  row-key="app_id"  :header-cell-style="{ background: '#eef1f6', color: '#606266' }" v-loading="loading"  ref="multipleTable" border class="eltable" :data="list"  style="width: 100%">
		<el-table-column align="center" property="app_id" label="编号" width="70"></el-table-column>
		<el-table-column align="center" property="application_name" label="应用名"></el-table-column>
		<el-table-column align="center" property="app_dir" label="应用目录"></el-table-column>
		<el-table-column align="center" property="app_type" label="应用类型">
			<template slot-scope="scope">
				<el-tag type="primary" v-if="scope.row.app_type == '1'" size="mini" effect="dark">后台应用</el-tag>
				<el-tag type="success" v-if="scope.row.app_type == '2'" size="mini" effect="dark">api应用</el-tag>
				<el-tag type="info" v-if="scope.row.app_type == '4'" size="mini" effect="dark">空应用</el-tag>
			</template>
		</el-table-column>
		<el-table-column align="center" property="status" label="生成状态">
			<template slot-scope="scope">
				<el-tag type="primary" v-if="scope.row.status == '1'" size="mini" effect="dark">正常</el-tag>
				<el-tag type="danger" v-if="scope.row.status == '0'" size="mini" effect="dark">禁用</el-tag>
			</template>
		</el-table-column>
		<el-table-column align="center" property="domain" label="访问域名">
			<template slot-scope="scope">
				<a :href="scope.row.domain" target="_blank">{{scope.row.domain}}</a>
			</template>
		</el-table-column>
		<el-table-column align="center" label="操作" width="180">
			<template slot-scope="scope">
				<el-button size="mini" type="primary" icon="el-icon-edit-outline" @click="editor(scope.row)">修改</el-button>
				<el-button size="mini" slot="reference" icon="el-icon-delete" @click="deleteApplication(scope.row)" type="danger">卸载</el-button>
			</template>
		</el-table-column>
	</el-table>
</el-card>
</div>

<!--添加应用弹窗-->
<add :show.sync="dialog.addDialogStatus" @refesh_list="loadlist"></add>

<!--修改应用弹窗-->
<update :show.sync="dialog.updateDialogStatus" :info="info" @refesh_list="loadlist"></update>
{/block}

{block name="script"}
<script src="__PUBLIC__/assets/js/app.js"></script>
<script src="__PUBLIC__/components/sys/application.js"></script>
<script>
new Vue({
	el: '#app',
	data: function() {
		return {
			dialog: {
				addDialogStatus : false,
				updateDialogStatus : false,
			},
			ids: {},
			single:true,
			multiple: true,
			list: [],
			info:{},
			loading: false,
		}
	},

	mounted(){
		this.loadlist()
        
        // JS 回退：在极端布局/祖先 transform 情况下，sticky 可能失效，使用轻量回退将按钮设置为 fixed
        this.$nextTick(() => {
            const scroller = this.$el.querySelector('.table-scroll-area');
            const sticky = this.$refs.stickyButtons;
            if (!scroller || !sticky) return;
            
            // 保存原始样式，以便恢复
            const original = {
                position: sticky.style.position || '',
                top: sticky.style.top || '',
                left: sticky.style.left || '',
                width: sticky.style.width || '',
                zIndex: sticky.style.zIndex || ''
            };
            
            const handleScroll = () => {
                // 当 scroller 的 scrollTop 超过某个阈值时，认为需要“粘住”
                // 阈值这里取 1，表示一旦发生滚动就粘住；若你想更精确可改成 sticky.offsetTop
                if (scroller.scrollTop > 0) {
                    // 如果浏览器支持 sticky 并且实际已经生效，保持 CSS sticky（仅加 class）
                    const computedPosition = window.getComputedStyle(sticky).position;
                    if (computedPosition === 'sticky' || computedPosition === '-webkit-sticky') {
                        sticky.classList.add('stuck');
                        // 不修改 position 样式，交由 CSS sticky 处理
                    } else {
                        // 回退：把按钮设置为 fixed，并与 scroller 对齐
                        const rect = scroller.getBoundingClientRect();
                        sticky.style.position = 'fixed';
                        sticky.style.top = (50) + 'px'; // 固定到视口 50px
                        sticky.style.left = rect.left + 'px';
                        sticky.style.width = rect.width + 'px';
                        sticky.style.zIndex = 9999;
                        sticky.classList.add('js-fixed');
                    }
                } else {
                    // 恢复原始样式
                    sticky.classList.remove('stuck');
                    sticky.classList.remove('js-fixed');
                    sticky.style.position = original.position;
                    sticky.style.top = original.top;
                    sticky.style.left = original.left;
                    sticky.style.width = original.width;
                    sticky.style.zIndex = original.zIndex;
                }
            };
            
            // 绑定滚动事件
            scroller.addEventListener('scroll', handleScroll, {passive: true});
            // 初始化一次
            handleScroll();
            
            // 存到元素，方便 beforeDestroy 时移除
            scroller._stickyHandler = handleScroll;
        });
        
    },
	methods:{
		loadlist() {
			this.loading = true
			axios.post(base_url+'/Sys.Base/applicationList').then(res => {
				if(res.status == 200){
					this.list = res.data.data.data
					this.loading = false
				}
			});
		},
		editor(row){
			if(row.app_id == 1){
				this.$message.error('该应用禁止修改!')
				return false
			}
			axios.post(base_url+'/Sys.Base/getApplicationInfo',{app_id:row.app_id}).then(res => {
				if(res.data.status == 200){
					this.dialog.updateDialogStatus = true;
					this.info = res.data.data
				}else{
					this.$message.error('获取信息失败!')
				}
			})
		},
		buildApplication(row,type){
			if(row.app_id == 1){
				this.$message.error('admin应用禁止生成!')
				return false
			}
			this.$confirm('确定生成吗?', '提示', {
				confirmButtonText: '确定',
				cancelButtonText: '取消',
				type: 'warning'
			}).then(() => {
				let id = row.app_id ? row.app_id : this.ids.join(',')
				axios.post(base_url+'/Sys.Base/buildApplication',{app_id:id,type}).then(res => {
					if(res.data.status == 200){
						this.$message({message: '生成成功', type: 'success'})
					}else{
						this.$message.error(res.data.msg)
					}
				})
			})
		},
		deleteApplication(row){
			if(row.app_id == 1){
				this.$message.error('该应用禁止卸载!')
				return false
			}
			this.$confirm('确定卸载吗?', '提示', {
				confirmButtonText: '确定',
				cancelButtonText: '取消',
				type: 'warning'
			}).then(() => {
				axios.post(base_url+'/Sys.Base/deleteApplication',{app_id:row.app_id}).then(res => {
					if(res.data.status == 200){
						this.$message({message: '操作成功', type: 'success'})
						this.loadlist()
					}else{
						this.$message.error('操作失败!')
					}
				});
			}).catch(() => {});
		},
		createDocProject(row,type){
			this.$confirm('确定生成吗?', '提示', {
				confirmButtonText: '确定',
				cancelButtonText: '取消',
				type: 'warning'
			}).then(() => {
				let id = row.app_id ? row.app_id : this.ids.join(',')
				axios.post(base_url+'/Sys.ApiPost/createDocProject',{app_id:id,type}).then(res => {
					if(res.data.status == 200){
						this.$message({message: '生成成功', type: 'success'})
					}else{
						this.$message.error(res.data.msg)
					}
				})
			})
		},
		selection(selection) {
			this.ids = {app_id:selection.app_id}
			this.single = false
		},
	},
})
</script>

<style>
    /* 固定表头按钮 */
    .table-scroll-area {
        max-height: calc(100vh - 155px); /* 根据实际页面头部/菜单高度调整这个数值 */
        overflow-y: auto;
        position: relative; /* sticky 的参照容器 */
    }
    
    .sticky-buttons {
        position: -webkit-sticky;
        position: sticky;
        top: 0px;            /* 固定在页面顶部下方 50px */
        z-index: 200;         /* 确保在表格上方，不被遮挡 */
        background: #fff;     /* 避免透明看见后面的内容 */
        padding: 0 0px 10px 0;
    }
    /* 固定表头按钮 */
</style>
{/block}
