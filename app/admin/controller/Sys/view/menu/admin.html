{extend name='view/common/container'}
{block name="content"}
<div style="margin:0 15px 15px 15px;">
    <el-card shadow="never" style="min-height:650px;" class="table-scroll-area">
        <div class="sticky-buttons">
            <el-row>
                <el-menu :default-active="active.toString()" class="el-menu-demo" mode="horizontal">
                    <el-menu-item @click="selectmenu(item)" v-for="item in app_list" :key="item.app_id"
                                  :index="item.app_id.toString()">
                        {{item.app_type == 3 ? item.application_name+'内容模型' : item.application_name}}
                    </el-menu-item>
                </el-menu>
            </el-row>
            <el-row style="margin-bottom:10px; margin-top:11px;">
                <el-col :span="20">
                    <el-button type="success" size="mini" icon="el-icon-plus" @click="dialog.addAdminDialogStatus = true">创建</el-button>
                    <el-button type="warning" size="mini"  icon="el-icon-plus" :disabled="single" @click="field(2)">字段管理</el-button>
                    <el-button type="sky-blue" size="mini"  icon="el-icon-plus" :disabled="single" @click="action">方法管理</el-button>
                    <el-button type="danger" size="mini"  icon="el-icon-s-promotion" :disabled="single" @click="es_synchronization">ES同步</el-button>
                    <el-button type="aqua" size="mini"  icon="el-icon-document" :disabled="single" @click="es_log">ES进度</el-button>
                    <el-button type="warning" size="mini"  icon="el-icon-edit-outline" :disabled="single" @click="field(1)">Ai生成字段</el-button>
                    <el-button type="info" size="mini"  icon="el-icon-edit-outline" :disabled="single" @click="create(1)">生成代码</el-button>
                    <el-select size="small" style="margin-left:5px; width:120px;" class="select" clearable v-model="appid" placeholder="菜单复制到">
                        <el-option v-for="(item,i) in copy_app_list" :key="i" :label="item.application_name" :value="item.app_id"></el-option>
                    </el-select>
                    <el-button type="primary" size="mini" style="margin-left:5px;" icon="el-icon-check" @click="copyMenu()">确定复制</el-button>
                    <el-select size="small" style="margin-left:5px; width:130px" class="select" @change="selectConnect" v-model="connect" placeholder="请选择链接库">
                        <el-option v-for="item in connects" :key="item" :label="item" :value="item"></el-option>
                    </el-select>
                    <el-select size="small" style="margin-left:5px; width:130px" class="select" v-model="tablename" placeholder="请选择表生成">
                        <el-option v-for="(item,i) in tableList" :key="i" :label="item" :value="item"></el-option>
                    </el-select>
                    <el-button type="primary" size="mini" style="margin-left:5px;" icon="el-icon-check" @click="createByTable(2)">根据表生成</el-button>
                </el-col>
                <el-col :span="4" style="text-align:right">
                    <table-tool :expand_status="true" :expand="expand" @toggle="toggleRowExpansion" @refesh_list="loadlist" ></table-tool>
                </el-col>
            </el-row>
        </div>
        
        <el-table :header-cell-style="{ background: '#eef1f6', color: '#606266' }" v-loading="loading" highlight-current-row :default-expand-all="expand" @current-change="handleCurrentChange" :tree-props="{children: 'children'}" row-key="menu_id" ref="multipleTable" border class="eltable" :data="list"   style="width: 100%">
            <el-table-column property="menu_id" align="center" type='' label="编号" width="70"></el-table-column>
            <el-table-column property="title" width="240" label="菜单名称"></el-table-column>
            <el-table-column property="controller_name" label="控制器名"></el-table-column>
            <el-table-column property="table_name" label="数据表名"></el-table-column>
            <el-table-column align="center" property="create_code" label="生成代码">
                <template slot-scope="scope">
                    <el-switch :active-value="1" :inactive-value="0" @change="update(scope.row,'create_code')" v-model="scope.row.create_code"></el-switch>
                </template>
            </el-table-column>
            <el-table-column align="center" property="status" label="菜单显示">
                <template slot-scope="scope">
                    <el-switch :active-value="1" :inactive-value="0" @change="update(scope.row,'status')" v-model="scope.row.status"></el-switch>
                </template>
            </el-table-column>
            <el-table-column align="center" property="status" label="es开关">
                <template slot-scope="scope">
                    <el-switch :active-value="1" :inactive-value="0" @change="update(scope.row,'enable_es')" v-model="scope.row.enable_es"></el-switch>
                </template>
            </el-table-column>
            <el-table-column align="center" property="create_table" label="创建数据库表">
                <template slot-scope="scope">
                    <el-tag size="mini" :type="scope.row.create_table=='1'?'success':'info'" effect="dark">{{ scope.row.create_table == '1' ? '是' : '否' }}</el-tag>
                </template>
            </el-table-column>
            <el-table-column width="90" align="center" property="sortid" label="排序">
                <template slot-scope="scope">
                    <el-input style="width:60px;" size="mini" placeholder="排序" @blur.stop="update(scope.row,'sortid')" v-model="scope.row.sortid"></el-input>
                </template>
            </el-table-column>
            <el-table-column label="操作" align="center" width="180">
                <template slot-scope="scope">
                    <el-button size="mini" @click="editorAdmin(scope.row)" icon="el-icon-edit-outline" type="primary" >修改</el-button>
                    <el-button size="mini" @click="deleteMenu(scope.row)" icon="el-icon-delete" type="danger">卸载</el-button>
                </template>
            </el-table-column>
        </el-table>
    </el-card>
</div>

<admin-add :show.sync="dialog.addAdminDialogStatus" app_id="{$appid}" :page_type_list="page_type_list" :list="list" :connects="connects" size="small" @refesh_list="loadlist"></admin-add>

<admin-update :show.sync="dialog.updateAdminDialogStatus" :info="info" :page_type_list="page_type_list" app_id="{$appid}" :list="list" :connects="connects"  size="small" @refesh_list="loadlist"></admin-update>
{/block}

{block name="script"}
<script src="__PUBLIC__/assets/libs/treeselect/vue-treeselect.umd.min.js"></script>
<link rel="stylesheet" href="__PUBLIC__/assets/libs/treeselect/vue-treeselect.min.css">
<script src="__PUBLIC__/components/sys/menu.js"></script>
<script src="__PUBLIC__/assets/js/app.js"></script>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                dialog: {
                    addAdminDialogStatus : false,
                    updateAdminDialogStatus : false,
                },
                expand:false,
                id:'',
                single:true,
                list: [],
                connects:[],
                connect:'',
                tablename:'',
                tableList:[],
                page_type_list:[],
                app_type:1,
                app_list:[],
                copy_app_list:[],
                info:{},
                appid:'',
                loading: false,
                active:'{$appid}'
            };
        },
        methods: {
            editorAdmin(row) {
                axios.post(base_url+'/Sys.Base/getMenuInfo',{menu_id:row.menu_id}).then(res => {
                    this.dialog.updateAdminDialogStatus = true
                    this.info = res.data.data
                })
            },
            selectmenu(val){
                var path = {
                    title:'菜单管理',
                    url:base_url+'/Sys.Base/menu',
                    fullurl:base_url+'/Sys.Base/menu?appid='+val.app_id
                }
                this.setTags(path)
                location.href = path.fullurl
            },
            field(type){
                var ai = '';
                if (type == 1) {
                    ai = '&ai=1'
                }
                var path = {
                    title:'字段管理',
                    url:base_url+'/Sys.Base/fieldList',
                    fullurl:base_url+'/Sys.Base/fieldList?menu_id='+this.id+'&appid={$appid}'+ai
                }
                this.setTags(path)
                location.href = path.fullurl
            },
            action(){
                var path = {
                    title:'方法管理',
                    url:base_url+'/Sys.Base/actionList',
                    fullurl:base_url+'/Sys.Base/actionList?menu_id='+this.id+'&appid={$appid}'
                }
                this.setTags(path)
                location.href = path.fullurl
            },
            setTags(path){
                var noUrl = true
                var changeData = false
                if(Cookies.get('menu')){
                    var tags = JSON.parse(Cookies.get('menu'))
                    tags.forEach(item=>{
                        if(item.url == path.url){
                            noUrl = false
                            if(item.fullurl !== path.fullurl){
                                changeData = true
                            }
                        }
                    })
                    if(noUrl){
                        tags.push(path)
                        Cookies.set('menu',JSON.stringify(tags))
                    }
                    
                    if(changeData){
                        tags.forEach(item=>{
                            if(item.url == path.url){
                                item.fullurl = path.fullurl
                            }
                        })
                        Cookies.set('menu',JSON.stringify(tags))
                    }
                }
            },
            handleCurrentChange(val) {
                this.id = val.menu_id
                this.single = false
            },
            toggleRowExpansion(){
                this.expand = !this.expand
                this.list.forEach(item=>{
                    this.$refs.multipleTable.toggleRowExpansion(item,this.expand)
                })
            },
            selectConnect(val){
                axios.post(base_url+'/Sys.Base/getTables',{connect:this.connect}).then(res => {
                    this.tableList = res.data.data
                })
            },
            async deleteMenu(val) {
                var msg = '确定卸载吗?'
                if(val.create_table){
                    const res = await axios.post(base_url+'/Sys/Base/getDbType',{dbname:val.connect})
                    if(res.data.data !== 'mongodb'){
                        msg = '卸载会同时删除数据库表'+val.table_name+'，确定卸载吗?'
                    }
                }
                this.$confirm(msg, '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(async () => {
                    const res = await axios.post(base_url+'/Sys.Base/deleteMenu',{menu_id:this.id})
                    if(res.data.status == 200){
                        this.$message({message: '操作成功', type: 'success'})
                        this.loadlist()
                    } else {
                        this.$message.error(res.data.msg)
                    }
                }).catch(() => {})
            },
            update(row,field){
                axios.post(base_url+'/Sys.Base/updateMenuExt',{menu_id:row.menu_id,[field]:row[field]}).then(res => {
                    if(res.data.status == 200){
                        this.$message({message: '操作成功', type: 'success'})
                    }else{
                        this.$message.error(res.data.msg)
                    }
                })
            },
            create(type){
                this.$confirm('确定生成吗?', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    axios.post(base_url+'/Sys.Base/create',{menu_id:this.id,type}).then(res => {
                        if(res.data.status == 200){
                            this.$message({message: '操作成功', type: 'success'})
                        }else{
                            this.$message.error(res.data.msg)
                        }
                    })
                }).catch(() => {})
            },
            createByTable(type){
                if(this.tablename == ''){
                    this.$message.error('请选择生成表')
                }else{
                    this.$confirm('确定生成吗?', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        if(this.connect == ''){
                            this.connect = 'mysql'
                        }
                        axios.post(base_url+'/Sys.Base/createByTable',{type,connect:this.connect,table_name:this.tablename,app_id:'{$appid}',app_type:this.app_type}).then(res => {
                            if(res.data.status == 200){
                                this.$message({message: '操作成功', type: 'success'})
                                this.loadlist()
                            }else{
                                this.$message.error(res.data.msg)
                            }
                        })
                    }).catch(() => {})
                }
            },
            copyMenu(){
                if(this.id == '' || this.appid == ''){
                    this.$message.error('请选择菜单或者应用')
                }else{
                    this.$confirm('确定生成吗?', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        axios.post(base_url+'/Sys.Base/copyMenu',{appid:this.appid,menu_id:this.id}).then(res => {
                            if(res.data.status == 200){
                                this.$message({message: '操作成功', type: 'success'})
                                this.loadlist()
                            }else{
                                this.$message.error(res.data.msg)
                            }
                        })
                    }).catch(() => {})
                }
            },
            loadlist() {
                this.loading = true
                axios.post(base_url+'/Sys.Base/menu',{app_id:'{$appid}'}).then(res => {
                    this.list = res.data.list
                    this.connects = res.data.connects
                    this.tableList = res.data.tableList
                    this.app_list = res.data.app_list
                    this.copy_app_list = res.data.app_list.filter(item=>item.app_type !== 3)
                    this.page_type_list = res.data.page_type_list
                    this.loading = false
                })
            },
            
            // es同步
            async es_synchronization() {
                if (this.id == '') {
                    this.$message.error('请选择菜单')
                }
                
                const res = await axios.post(base_url + '/Sys.Base/esCheck', {id: this.id})
                if (res.data.status != 200) {
                    this.$message.error(res.data.msg)
                    return;
                }
                
                this.$confirm('确定同步数据到ES数据库中吗?', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(async (confirm_res) => {
                    const res = await axios.post(base_url + '/Sys.Base/esSynchronization', {id: this.id})
                    if (res.data?.code) {
                        res.data.status = res.data?.code;
                    }
                    if (res.data.status != 200) {
                        this.$message.error(res.data.msg)
                    } else {
                        this.$message.success(res.data.msg)
                    }
                    // console.log({confirm_res, res})
                }).catch((cancel_res) => {
                    // console.log({cancel_res})
                })
                
            },
            // es日志
            async es_log() {
                console.log('es_log', this.id)
                const res = await axios.post(base_url + '/Sys.Base/esCheck', {id: this.id})
                if (res.data.status != 200) {
                    this.$message.error(res.data.msg)
                    return;
                }
                
                var path = {
                    title: '同步进度',
                    url: base_url + '/Sys.Base/esLog',
                    fullurl: base_url + '/Sys.Base/esLog?id=' + this.id + '&appid={$appid}'
                }
                this.setTags(path)
                location.href = path.fullurl
                
            },
            
        },
        mounted() {
            this.loadlist()
            // JS 回退：在极端布局/祖先 transform 情况下，sticky 可能失效，使用轻量回退将按钮设置为 fixed
            this.$nextTick(() => {
                const scroller = this.$el.querySelector('.table-scroll-area');
                const sticky = this.$refs.stickyButtons;
                if (!scroller || !sticky) return;
                
                // 保存原始样式，以便恢复
                const original = {
                    position: sticky.style.position || '',
                    top: sticky.style.top || '',
                    left: sticky.style.left || '',
                    width: sticky.style.width || '',
                    zIndex: sticky.style.zIndex || ''
                };
                
                const handleScroll = () => {
                    // 当 scroller 的 scrollTop 超过某个阈值时，认为需要“粘住”
                    // 阈值这里取 1，表示一旦发生滚动就粘住；若你想更精确可改成 sticky.offsetTop
                    if (scroller.scrollTop > 0) {
                        // 如果浏览器支持 sticky 并且实际已经生效，保持 CSS sticky（仅加 class）
                        const computedPosition = window.getComputedStyle(sticky).position;
                        if (computedPosition === 'sticky' || computedPosition === '-webkit-sticky') {
                            sticky.classList.add('stuck');
                            // 不修改 position 样式，交由 CSS sticky 处理
                        } else {
                            // 回退：把按钮设置为 fixed，并与 scroller 对齐
                            const rect = scroller.getBoundingClientRect();
                            sticky.style.position = 'fixed';
                            sticky.style.top = (50) + 'px'; // 固定到视口 50px
                            sticky.style.left = rect.left + 'px';
                            sticky.style.width = rect.width + 'px';
                            sticky.style.zIndex = 9999;
                            sticky.classList.add('js-fixed');
                        }
                    } else {
                        // 恢复原始样式
                        sticky.classList.remove('stuck');
                        sticky.classList.remove('js-fixed');
                        sticky.style.position = original.position;
                        sticky.style.top = original.top;
                        sticky.style.left = original.left;
                        sticky.style.width = original.width;
                        sticky.style.zIndex = original.zIndex;
                    }
                };
                
                // 绑定滚动事件
                scroller.addEventListener('scroll', handleScroll, {passive: true});
                // 初始化一次
                handleScroll();
                
                // 存到元素，方便 beforeDestroy 时移除
                scroller._stickyHandler = handleScroll;
            });
            
            
        },
    })
</script>


<style>
    /* 固定表头按钮 */
    .table-scroll-area {
        max-height: calc(100vh - 155px); /* 根据实际页面头部/菜单高度调整这个数值 */
        overflow-y: auto;
        position: relative; /* sticky 的参照容器 */
    }
    
    .sticky-buttons {
        position: -webkit-sticky;
        position: sticky;
        top: 0px;            /* 固定在页面顶部下方 50px */
        z-index: 200;         /* 确保在表格上方，不被遮挡 */
        background: #fff;     /* 避免透明看见后面的内容 */
        padding: 0 0px 10px 0;
    }
    /* 固定表头按钮 */
</style>
{/block}
